name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kalshi_news_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kalshi_news_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "./backend[dev]"
      - run: cd backend && ruff check .
      - run: cd backend && alembic upgrade head
      # alembic upgrade head / downgrade base only proves the migrations
      # run -- the test suite builds its own schema with create_all, so
      # nothing had ever actually written to the alembic-built schema.
      # This inserts a real row (exercising 0002_seed_sources' NOT NULL /
      # server_default columns), reads it back, and fails the build if it
      # doesn't work.
      - run: cd backend && python scripts/ci_migration_smoke_test.py
      - run: cd backend && alembic downgrade base
      - run: cd backend && python -m pytest tests/ -v
